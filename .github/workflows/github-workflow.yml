name: Build MOT-CycleControl Firmware

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Display PlatformIO Version
        run: pio --version
      
      - name: Install Project Dependencies
        run: pio pkg install
      
      - name: Build Firmware
        run: pio run -e esp32dev
      
      - name: Display Build Info
        run: |
          echo "Build completed successfully!"
          echo "Firmware location: .pio/build/esp32dev/firmware.bin"
          ls -lh .pio/build/esp32dev/
      
      - name: Extract Version from Config
        id: version
        run: |
          VERSION=$(grep -oP '#define APP_VERSION "\K[^"]+' include/Config.h || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Firmware Version: $VERSION"
      
      - name: Rename Firmware with Version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          cp .pio/build/esp32dev/firmware.bin firmware-${VERSION}-${COMMIT_SHORT}.bin
          echo "Created: firmware-${VERSION}-${COMMIT_SHORT}.bin"
      
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: |
            firmware-*.bin
            .pio/build/esp32dev/firmware.bin
          retention-days: 90
      
      - name: Build Summary
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Firmware Size" >> $GITHUB_STEP_SUMMARY
          SIZE=$(stat -c%s .pio/build/esp32dev/firmware.bin)
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "- **Binary Size**: ${SIZE_MB} MB (${SIZE} bytes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifact from the Actions tab!" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Download Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32
      
      - name: Extract Version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            firmware-*.bin
          body: |
            ## MOT-CycleControl ${{ steps.version.outputs.version }}
            
            ### What's New
            - See [CHANGELOG.md](CHANGELOG.md) for details
            
            ### Installation Methods
            
            #### 1. OTA Update (Wireless)
            1. Connect to `MOT-CycleControl` Wi-Fi
            2. Go to: `http://192.168.4.1/update`
            3. Upload `firmware.bin`
            4. Wait for reboot
            
            #### 2. USB Flash (PlatformIO)
            ```bash
            pio run -t upload
            ```
            
            #### 3. Web Flasher (Browser)
            Visit: [Web Flasher](https://your-username.github.io/MOT-CycleControl/web-flasher.html)
            
            ### SHA256 Checksums
            ```
            $(sha256sum firmware-*.bin)
            ```
            
            ### Safety Reminder
            ⚠️ **DANGER: High voltage and current!**
            - Disconnect MOT from mains before firmware update
            - Test with safe load (12V bulb) first
            - Use RCD, proper fusing, and enclosure
            - Read [README.md](README.md) safety section
            
            ---
            
            **Full Changelog**: ${{ github.event.repository.html_url }}/compare/${{ github.event.before }}...${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
