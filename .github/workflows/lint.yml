name: Code Quality Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Run PlatformIO Check
        run: pio check -e esp32dev --skip-packages --fail-on-defect=medium
        continue-on-error: true
      
      - name: Check Code Formatting
        run: |
          echo "Checking for tabs and CRLF..."
          ! git grep -I $'\t' -- '*.cpp' '*.h' '*.ino' || echo "Warning: Tabs found in source files"
          ! git grep -I $'\r' -- '*.cpp' '*.h' '*.ino' || echo "Warning: CRLF line endings found"
      
      - name: Check File Sizes
        run: |
          echo "Checking file sizes..."
          MAX_SIZE=500000  # 500 KB
          find src include -type f \( -name "*.cpp" -o -name "*.h" \) -size +${MAX_SIZE}c -exec ls -lh {} \; || true
      
      - name: Validate Configuration
        run: |
          echo "Validating Config.h..."
          if [ -f include/Config.h ]; then
            echo "Config.h exists"
            grep -q "APP_VERSION" include/Config.h && echo "APP_VERSION defined" || echo "Warning: APP_VERSION not found"
            grep -q "SSR_PIN" include/Config.h && echo "SSR_PIN defined" || echo "Error: SSR_PIN not found"
          else
            echo "Error: Config.h not found!"
            exit 1
          fi

  compile-test:
    name: Compile Test (Multiple Configs)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_flags:
          - "-D ENABLE_OTA=1"
          - "-D ENABLE_OTA=0"
          - "-D DEBUG_SERIAL=false"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Build with Custom Flags
        run: |
          echo "Building with: ${{ matrix.build_flags }}"
          pio run -e esp32dev
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.build_flags }}
